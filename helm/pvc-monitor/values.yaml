nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  # Build and push your own image; there is no public one.
  repository: registry.example.com/pvc-monitor
  tag: ""            # defaults to .Chart.AppVersion (a placeholder)
  # Image digest ("sha256:..."). When set it takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

# Pull secrets for a private registry, e.g. [{name: my-registry-credentials}].
imagePullSecrets: []

serviceAccount:
  create: true
  # Required when create is false: the existing ServiceAccount that receives
  # cluster-wide read access to PVs, PVCs and VolumeSnapshots.
  name: ""           # defaults to the fullname when create is true

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

# Addresses (comma-separated IPs or CIDRs) whose X-Forwarded-* headers uvicorn
# trusts; sets FORWARDED_ALLOW_IPS. Empty keeps the uvicorn default (loopback only),
# so the scheme and client address sent by the Gateway are ignored. With
# gateway.enabled, set it to the Gateway data-plane pod range so the app sees the
# original https scheme and client address.
forwardedAllowIps: ""

# CA bundle used to verify the vCenter TLS certificate. Name an existing ConfigMap
# or Secret in the release namespace (not both); the chart mounts it read-only and
# sets VCENTER_CA_FILE. Leave both empty to use the system trust store.
vcenterCA:
  configMapName: ""
  secretName: ""
  key: ca.crt

# Credentials / app config, injected via envFrom.
secret:
  # Use a Secret you manage yourself (must exist in the release namespace).
  # When set, the chart does not create one and cannot check its contents; the
  # application itself refuses to start when authentication is enabled but the
  # OIDC settings, SESSION_SECRET or ALLOWED_GROUPS are missing. The chart also does
  # not default TRUSTED_HOSTS and OIDC_REDIRECT_URI then; put them in that Secret.
  existingSecret: ""
  # Otherwise the chart creates a Secret from these values. Supply real values with
  # `--set-file`/a private values file or (better) use existingSecret / an external secret operator.
  data:
    VCENTER_HOST: ""
    VCENTER_USER: ""
    VCENTER_PASSWORD: ""
    VCENTER_PORT: "443"
    # Verify the vCenter certificate. Use vcenterCA for a private CA instead of disabling this.
    VCENTER_VERIFY_SSL: "true"
    # Seconds a request waits for a running vCenter scan before it gets 503 "scan in progress".
    VCENTER_SCAN_WAIT_SECONDS: "120"

    # Email alerting
    SMTP_HOST: ""
    SMTP_PORT: "587"
    SMTP_USE_TLS: "true"
    SMTP_FROM: ""
    SMTP_USER: ""
    SMTP_PASSWORD: ""
    ALERT_EMAIL_TO: ""
    ALERT_SNAPSHOT_AGE_DAYS: "7"
    # Minimum 1.
    ALERT_CHECK_INTERVAL_HOURS: "24"

    # OIDC authentication. Unless AUTH_ENABLED is false ("false", "0", "no" or "off",
    # any case), OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, SESSION_SECRET and
    # ALLOWED_GROUPS are required; rendering fails without them. A false AUTH_ENABLED
    # is only accepted when the app is not exposed (gateway.enabled=false and
    # service.type=ClusterIP).
    AUTH_ENABLED: "true"
    OIDC_ISSUER: ""
    OIDC_CLIENT_ID: ""
    OIDC_CLIENT_SECRET: ""
    # Full callback URL. Empty with gateway.enabled: https://<gateway.hostname>/auth/callback.
    OIDC_REDIRECT_URI: ""
    OIDC_SCOPES: "openid email profile groups"
    # Comma-separated groups allowed to access the app. Required with authentication;
    # "*" allows every user the identity provider authenticates (logged as a warning).
    ALLOWED_GROUPS: ""
    # At least 32 random characters, e.g. `openssl rand -hex 32`.
    SESSION_SECRET: ""
    SESSION_SECURE: "true"
    SESSION_MAX_AGE_HOURS: "12"
    # Comma-separated Host header values the app accepts. Empty with gateway.enabled:
    # gateway.hostname.
    TRUSTED_HOSTS: ""
    # Exposes vSphere diagnostics; keep disabled outside troubleshooting.
    ENABLE_DEBUG_ENDPOINT: "false"

# Gateway API exposure. With the chart's own Secret, an empty secret.data.TRUSTED_HOSTS
# and OIDC_REDIRECT_URI default to this hostname (set them yourself with
# secret.existingSecret). Also set forwardedAllowIps (above) to the Gateway data-plane
# addresses, so the app sees the original https scheme and client address.
gateway:
  enabled: true
  hostname: pvc-monitor.example.com
  # Existing Gateway the ListenerSet attaches to. It must allow ListenerSets
  # (spec.allowedListeners.namespaces.from).
  parentRef:
    name: ""
    namespace: ""
    group: gateway.networking.k8s.io
    kind: Gateway
  listenerSet:
    name: ""         # defaults to the fullname
    listenerName: https
    port: 443
    protocol: HTTPS
    tlsMode: Terminate
    # Secret holding the TLS cert; defaults to the hostname.
    tlsSecretName: ""
  httpRoute:
    annotations: {}
    path: /
    pathType: PathPrefix

# cert-manager Certificate for the listener's TLS secret.
certificate:
  enabled: true
  issuerRef:
    name: ""         # required when certificate.enabled and gateway.enabled
    kind: ClusterIssuer
    group: cert-manager.io

# Ingress NetworkPolicy for the pod. Only the peers in ingressFrom may reach the
# HTTP port; everything else is denied. Set ingressFrom to the Gateway data plane,
# for example:
#   ingressFrom:
#     - namespaceSelector:
#         matchLabels:
#           kubernetes.io/metadata.name: gateway-system
#       podSelector:
#         matchLabels:
#           app.kubernetes.io/name: my-gateway
# Kubelet probes come from the pod's own node. NetworkPolicy does not block traffic
# from the node a pod runs on, so probes keep working without a rule; this also
# means other host-network processes on that node are not restricted. With gateway.enabled an empty ingressFrom fails rendering;
# without it, an empty list denies all ingress.
networkPolicy:
  enabled: true
  ingressFrom: []

{{- include "pvc-monitor.validate" . }}
{{- if .Values.networkPolicy.enabled }}
# Only the configured peers (normally the Gateway data plane) may reach the HTTP
# port. NetworkPolicy does not filter traffic from the pod's own node, which is
# how kubelet probes still arrive. An empty ingressFrom denies all ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pvc-monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pvc-monitor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pvc-monitor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if .Values.networkPolicy.ingressFrom }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}

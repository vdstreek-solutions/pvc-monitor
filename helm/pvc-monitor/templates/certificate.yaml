{{- include "pvc-monitor.validate" . }}
{{- if and .Values.gateway.enabled .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "pvc-monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pvc-monitor.labels" . | nindent 4 }}
spec:
  secretName: {{ include "pvc-monitor.tlsSecretName" . }}
  dnsNames:
    - {{ .Values.gateway.hostname | quote }}
  issuerRef:
    name: {{ required "certificate.issuerRef.name is required (or set certificate.enabled=false)" .Values.certificate.issuerRef.name }}
    kind: {{ .Values.certificate.issuerRef.kind }}
    group: {{ .Values.certificate.issuerRef.group }}
{{- end }}

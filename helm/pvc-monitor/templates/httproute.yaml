{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "pvc-monitor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pvc-monitor.labels" . | nindent 4 }}
  {{- with .Values.gateway.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ include "pvc-monitor.listenerSetName" . }}
      sectionName: {{ .Values.gateway.listenerSet.listenerName }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: {{ .Values.gateway.httpRoute.pathType }}
            value: {{ .Values.gateway.httpRoute.path }}
      backendRefs:
        - name: {{ include "pvc-monitor.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}

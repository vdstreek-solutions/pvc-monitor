{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ include "pvc-monitor.listenerSetName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pvc-monitor.labels" . | nindent 4 }}
spec:
  parentRef:
    group: {{ .Values.gateway.parentRef.group }}
    kind: {{ .Values.gateway.parentRef.kind }}
    name: {{ required "gateway.parentRef.name is required" .Values.gateway.parentRef.name }}
    {{- with .Values.gateway.parentRef.namespace }}
    namespace: {{ . }}
    {{- end }}
  listeners:
    - name: {{ .Values.gateway.listenerSet.listenerName }}
      hostname: {{ required "gateway.hostname is required" .Values.gateway.hostname | quote }}
      port: {{ .Values.gateway.listenerSet.port }}
      protocol: {{ .Values.gateway.listenerSet.protocol }}
      tls:
        mode: {{ .Values.gateway.listenerSet.tlsMode }}
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ include "pvc-monitor.tlsSecretName" . }}
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
{{- end }}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers for every response. The proxied locations get their
    # Content-Security-Policy from the backend (the sign-in pages carry their own),
    # so the policy is only added for the SPA below.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location /auth/ {
        proxy_pass http://backend:8000;
    }

    location = /healthz {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # An add_header here drops the server-level ones, so all are repeated.
        # Same policy as _CSP in backend/main.py; keep both in step.
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
